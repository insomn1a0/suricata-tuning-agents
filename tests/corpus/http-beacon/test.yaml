# Six identical check-ins alert once (threshold 5 in 600 s); a single request from another host does not.
requires:
  min-version: 8.0.0
checks:
  - filter:
      count: 1
      match: {event_type: alert, alert.signature_id: 9190001, src_ip: 10.10.100.23}
  - filter:
      count: 0
      match: {event_type: alert, alert.signature_id: 9190001, src_ip: 10.10.100.25}
