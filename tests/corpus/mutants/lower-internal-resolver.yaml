# A plausible but wrong decision: "everything to our own resolver is internal noise - lower it".
# Schema-valid, semantically valid, its own generated tests pass. A shared resolver is not a client:
# every workstation's DNS goes through it, so this hides DNS tunnelling from all of them (docs/PLAYBOOK.md).
id: lower-internal-resolver
card: examples/cards/2025701.md
status: approved
action: lower
sids: [9190002]
signature: LAB Possible DNS tunnelling - long query label
metadata: {signature_severity: Major, confidence: Medium}
routes:
  - dst: 10.10.0.53
    dst_port: 53
level: 3
description: Long DNS label via the internal resolver $(dest_ip) from $(src_ip)
rationale: The internal resolver produces most DNS alerts.
risk: DNS tunnelling from any client through the resolver is no longer visible.
compensating_control: none
wazuh:
  parent: 100204
  rule_ids: [100228]
