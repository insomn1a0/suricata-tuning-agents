# Optional for contributors: `pip install pre-commit && pre-commit install`. CI runs the same checks.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
      - id: kit-lint
        name: generated files current, rule lint, lab data only, doc links
        entry: make lint
        language: system
        pass_filenames: false
