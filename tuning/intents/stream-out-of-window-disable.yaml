# Stream-engine noise: retransmissions and capture loss on every busy link. Already hidden (no metadata, stock
# level 3), but 3300 events a week fill the archives and the indexer licence for nothing an analyst can act on.
id: stream-out-of-window-disable
card: examples/cards/2210020.md
status: approved
action: disable
sids: [2210020]
signature: SURICATA STREAM ESTABLISHED packet out of window
rationale: >-
  One event per flow, every workstation, every destination, around the clock: no alert-level action exists.
  What it can indicate - a lossy capture path, TCP evasion - is a property of the sensor, seen in its counters.
risk: >-
  An evasion attempt that only shows as out-of-window packets is no longer an event; the stream engine still
  normalises the session, so signatures on the reassembled stream keep firing.
compensating_control: >-
  Sensor team alerts on capture.kernel_drops and tcp.reassembly_gap from Suricata stats
  (owner-confirmed).
