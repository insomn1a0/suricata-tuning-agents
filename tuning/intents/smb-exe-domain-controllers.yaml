# GPO and logon scripts make every client read executables from SYSVOL/NETLOGON every morning.
id: smb-exe-domain-controllers
card: examples/cards/2025701.md
status: approved
action: enrich
sids: [2025701]
signature: ET INFO SMB2 NT Create AndX Request For an Executable File
metadata: {signature_severity: Minor, confidence: High}
routes:   # one route per DC: each gets its own ignore window
  - dst: 10.10.0.10   # dc1
    dst_port: 445
  - dst: 10.10.0.11   # dc2
    dst_port: 445
level: 6
rate_limit:
  ignore_seconds: 3600
description: >-
  SMB executable access on domain controller $(dest_ip) from $(src_ip): usually GPO/logon scripts,
  verify if the file is new or changed (repeats suppressed for 1h)
rationale: >-
  The signal is a new or changed file in SYSVOL, not each reader. Visible, with what to verify, at most once an hour.
risk: >-
  `ignore` is global for the rule, not per source - a second client of the same DC inside the hour is
  archived only.
compensating_control: DC audit of SYSVOL/NETLOGON writes (5145/4663).
wazuh:
  parent: 100206
  rule_ids: [100221, 100222]
tests:
  neighbour_sids: [2025709]
  extra:
    - note: 10.10.0.12 is not a DC
      dst: 10.10.0.12
      dst_port: 445
