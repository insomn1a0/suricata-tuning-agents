signature: EXAMPLE TLS SNI of Remote Administration Tool Relay
metadata: {signature_severity: Major, confidence: Medium}
routes:
  - proto: TCP              # TLS: every event of the SID, from any host
level: 8
description: >-
  Remote-admin tool relay from $(src_ip) to $(dest_ip): resolve the DHCP lease holder, check the approved-tools
